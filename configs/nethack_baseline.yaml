schema_version: 1
study: nethack-baseline
# Deliberately isolated: the native 23-action score policy is behavioral
# context, not a compatible member of the eight-action MiniHack subspace.
artifact_root: artifacts/nethack-baseline
# Disjoint from both the observed pilot (0, 1) and the MiniHack confirmation
# cohort (10-14).
seeds: [20, 21, 22, 23, 24]
environments: [NetHackScore-v0]
experimental_design:
  training_seed_count: 5
  environment_families: [nethack]
  evaluation_seed_policy: fixed_per_environment
training:
  algorithm: APPO
  runtime: sol_patched
  max_environment_steps: 2000000
  evaluation_interval: 200000
  evaluation_episodes: 50
  # NetHackScore has no MiniHack task-success endpoint. The shared field is
  # ignored for this score-return baseline; mean NLE score is the outcome.
  minimum_success: 0.0
  checkpoint_retention: 32
  checkpoint_save_interval_seconds: 3600
  heartbeat_reporting_interval_seconds: 3600
evaluation_buffer:
  sequences: 512
  sequence_length: 32
  fixed_seeds: [2101]
analysis:
  primary_modules: [encoder, actor]
  explained_variance: 0.95
  null_replicates: 1000
  bootstrap_replicates: 1000
  # One raw NLE score point is the prespecified practical effect for the
  # baseline's score-return learning-curve power diagnostic.
  practical_effect_size: 1.0
  leave_one_task_out: true
adapters:
  repositories:
    - TransferGraph/roberta-base-finetuned-lora-ag_news
    - TransferGraph/roberta-base-finetuned-lora-tweet_eval_irony
    - TransferGraph/roberta-base-finetuned-lora-tweet_eval_emotion
    - TransferGraph/roberta-base-finetuned-lora-tweet_eval_hate
  projections: [query, value]
gate:
  immutable: true
  null_effect_min_sd: 2.0
  retention_median_min: 0.90
  retention_ci_low_min: 0.80
  action_kl_max: 0.05
  action_agreement_min: 0.95
  feature_cka_min: 0.90
  normalized_value_rmse_max: 0.10
