services:
  research-cpu:
    build:
      context: .
      target: cpu
    user: "${UID:-1000}:${GID:-1000}"
    volumes:
      - ./artifacts:/workspace/artifacts
      - ./configs:/workspace/configs:ro
      - hf-cache:/cache/huggingface
    environment:
      HF_HOME: /cache/huggingface

  research-gpu:
    build:
      context: .
      target: gpu
    user: "${UID:-1000}:${GID:-1000}"
    gpus: all
    volumes:
      - ./artifacts:/workspace/artifacts
      - ./configs:/workspace/configs:ro
      - hf-cache:/cache/huggingface
    environment:
      HF_HOME: /cache/huggingface

  tensorboard:
    image: tensorflow/tensorflow:2.16.1
    # Sample Factory writes live scalar event files under each experiment's
    # `.summary/0` directory. Point TensorBoard at the active confirmatory
    # population root rather than the unused legacy tensorboard directory.
    command: tensorboard --logdir=/artifacts/phase0-confirmatory-r2/sample_factory --host=0.0.0.0 --port=6006
    ports:
      - "6006:6006"
    volumes:
      - ./artifacts:/artifacts:ro

volumes:
  hf-cache:
