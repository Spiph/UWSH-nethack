[project]
name = "universal-policy-subspaces"
version = "0.1.0"
description = "Reproducible Phase Zero measurement harness for universal policy subspaces"
readme = "README.md"
requires-python = ">=3.10,<3.11"
dependencies = [
  "numpy>=1.24,<2.0",
  "pandas>=2.0,<3",
  "pyarrow>=14,<20",
  "pydantic>=2.5,<3",
  "pyyaml>=6,<7",
  "safetensors>=0.4,<1",
  "scipy>=1.10,<2",
  "torch==2.2.2",
  "typer>=0.12,<1",
  "zarr>=2.16,<3",
]

[project.optional-dependencies]
appo = [
  "sample-factory==2.1.1",
  "tensorboard>=2.15,<3",
]
nle = [
  "minihack==1.0.2",
  "nle==1.3.0",
  "setuptools==80.9.0",
]
adapter = ["huggingface-hub>=0.20,<1", "peft>=0.10,<1", "transformers>=4.38,<5"]
sol = [
  "gymnasium==1.0.0",
  "minihack==1.0.2",
  "pybind11>=2.13,<3",
  "tensorboardX>=2.6,<3",
  "signal-slot-mp>=1.0.3,<2",
  "colorlog>=6,<7",
  "pyglet>=2,<3",
  "threadpoolctl>=2,<4",
  "psutil>=5.7,<8",
  "opencv-python>=4.8,<5",
  "inflect>=7,<8",
  "cython>=3,<4",
  "setuptools==80.9.0",
  "wandb>=0.20,<1",
]
dev = [
  "mypy>=1.8,<2",
  "pre-commit>=3.6,<5",
  "pytest>=7.4,<9",
  "pytest-cov>=4.1,<7",
  "ruff>=0.5,<1",
  "types-PyYAML>=6.0",
]

[tool.uv]
conflicts = [
  [{ extra = "appo" }, { extra = "nle" }],
  [{ extra = "appo" }, { extra = "sol" }],
  [{ extra = "nle" }, { extra = "sol" }],
]

[project.scripts]
ups = "ups.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ups"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["B008"]

[tool.mypy]
python_version = "3.10"
strict = true
packages = ["ups"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["ups"]

[tool.coverage.report]
show_missing = true
fail_under = 90
